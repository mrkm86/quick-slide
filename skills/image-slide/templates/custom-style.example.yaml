# カスタムスタイルの雛形（image-slide・ADR 0007）。写して自分の置き場（呼ぶ側のスキル・自分のフォルダ）で書き換え、
#   image_slide.py deck --script … --style <このファイル>
# で渡す。スタイルは「どんな絵にするか」（画風・字体・余白の調子・色の使い方）だけを書く。
#   - 構図（どこに何を置くか）はカスタムレイアウト（custom-layout.example.yaml・--layout）に書く
#   - 何色かはブランド（--theme）が決める。ここでは色の使い方だけを書く
#   - 文字の言葉遣いはここでは変えられない（文字は台本のまま描く）
name: weekly                      # 必須。build.json・inspect.md・描く指示に出る名前
description: 社内向け週報の1枚ポスター。フラットイラストのインフォグラフィック   # 任意。選ぶ人向けの補足
# bleed: true                    # 任意。true なら本文のページも全面に描かせ、下端に無地の帯を作らない（visual と同じ・ADR 0009）。
#                                 # フッタ・ページ番号・ロゴは絵の上に重ね、下の明るさで色を選ぶ。ロゴの角を空けたいならレイアウトの構図に書く
text: |                           # 必須。描く指示の「スタイル」の節に入る文章
  社内向け週報の、読みやすく親しみやすいフラットイラストのインフォグラフィック。
  写真・リアルな画像は使わない。地は白、主役色は面・図形・装飾に大胆に使い、細い線や小さな文字には使わない
