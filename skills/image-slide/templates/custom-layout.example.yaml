# カスタムレイアウトの雛形（image-slide・ADR 0006）。写して自分の置き場で書き換え、
#   image_slide.py deck --script … --layout <このファイル>
# で渡し、台本のページに "_layout": {"name": "<name>", "parts": {…}} と書いたページだけに効く。
# レイアウトは「どこに何を置くか」（構図）だけを書く。画風はカスタムスタイル（--style）に書く。
# 書き方のこつ（週報で試して効いたもの・ADR 0006）:
#   - 区画ごとに、位置・比率・入れるものを上から番号付きで言い切る（「上端の横帯」「左1/3」「最下部・左80%の幅」）
#   - 台本のコンテンツ（見出しと段）がどの区画に入るかを書く（「右2/3が主役で、このページのコンテンツを…」）
#   - 型のキーに無い欄は parts に置き場を書き、ページ側から文字を渡す（置き場と文字が対になって迷わない）
name: weekly-report               # 必須。ページの _layout で呼ぶ名前
composition: |                    # 必須。構図の文章
  1枚で読み切る週報のポスター。上から4段の固定レイアウト。
  1. ヘッダ（上端の横帯）: 左にページタイトル（大・太字）とその下に期間の日付。中央に「今週の案件 / This Week's Work」のラベルを主役色で塗った小さな角丸長方形に入れ、その右隣に案件を1行で並べる。右端に週バッジ（主役色の角丸長方形に白抜きの文字）
  2. ヒーロー（画面の中央・一番大きな面積）: 左1/3は「今週のキーワード」の図解。右2/3が主役で、このページのコンテンツ（見出しと段）を1つの統合した流れ図として、矢印で1本につなぐ
  3. 学びの帯（ヒーローの下・全幅）: 主役色で塗った角丸の横帯。左端に白い円のバッジ、その右に一文を白い太字で大きく
  4. チームの近況（最下部・左80%の幅）: 左右2カラム。各カラムは「絵文字＋メンバーの名前」「「取り組んでいるテーマ」」「一言サマリ」の3行
# reference: sample.png           # 任意。構図の見本の絵（このファイルからの相対でよい）。参照画像として添える。無くても効く
parts:                            # 任意。台本の型のキーに無い部品の置き場（ページの _layout.parts で文字を渡す）
  title_block: ヘッダ左。1行目はページタイトル、2行目は期間の日付
  week_badge: ヘッダ右端の週バッジ
  takeaway: 学びの帯。label は白い円のバッジの中、text はその右の白い太字
