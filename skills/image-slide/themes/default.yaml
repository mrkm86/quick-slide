# 資料の既定の色（html-slide の themes/default.yaml と同じ）。白の地・チャコールの文字・シアンの主役の色1つ（差し色は書かない＝主役の色と同じ）（2026-10-05 に青から替えた）
# キーは background・ink・primary（必須）と accent・muted・surface・font（任意）。image-slide は描く指示の色に使う（muted・surface があれば添える）
# background … スライドの地
# ink        … 本文と見出しの文字
# primary    … 主役の色。骨格（上の帯・小見出し・番号・章扉・矢羽根・連絡先）
# accent     … 差し色（任意）。台本の *語*・accent: true の項目・強調する棒と線。書かなければ primary と同じ
#              例: 黄色が主役で青が差し色なら primary: "#f5a623"・accent: "#399dd1"
# font       … 字体名（PPTX の字体名にもなる）。字体ファイルは設定（config.example.yaml を見る）の fonts で引く
background: "#ffffff"
ink: "#404040"
primary: "#0db4f2"
font: "Yu Gothic"
