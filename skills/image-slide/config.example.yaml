# image-slide の設定の雛形。実体はデータの置き場（既定 ~/.quick-slide/）の engines/image-slide/config.yaml に置く（機体ごとに違う値）。
# 環境変数 IMAGE_SLIDE_CONFIG で別の場所を直に指せる
# 無ければ既定値で動く。

# 出力先（--out を省いたとき）。<out>/<台本の名前>/ に deck.pptx などが出る
out: ~/.quick-slide/engines/image-slide/output

# 同時に描く数（--parallel が優先）。サブスク枠は画像で減りが速いので、日常は 8 にしておく
max_parallel: 8

# 1枚の上限（秒）。実測は1枚 40〜70 秒
timeout: 600

# codex の実行ファイル（省略時は PATH から探す）
# codex_bin: /opt/homebrew/bin/codex

# 帯の文字（フッタ・ページ番号）を確認用の PNG に焼くときの字体ファイル。PPTX ではテーマの font の名前で入る
fonts:
  "Yu Gothic":
    regular: /Applications/Microsoft PowerPoint.app/Contents/Resources/DFonts/YuGothR.ttc
    bold: /Applications/Microsoft PowerPoint.app/Contents/Resources/DFonts/YuGothB.ttc

# 描いた絵の置き場（キャッシュ・ADR 0015）。省けば ~/Library/Caches/quick-slide/image-slide/（環境変数 IMAGE_SLIDE_CACHE が優先）
# cache_dir: ~/Library/Caches/quick-slide/image-slide
# 合計の上限（MB）。超えたら古く使った区画から消す。0 は消さない。描いた絵は1枚約 2 MB
# cache_max_mb: 1024
