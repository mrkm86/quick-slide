<!doctype html>
<!-- 描き出し係のテスト用: 決まりに沿った HTML（3枚）。段の数は 0 / 2 / 1、ノートの［クリック］も同じ数 -->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>決まりのテスト</title>
    <style>
      @font-face { font-family: "Yu Gothic"; font-weight: 400; src: url("file:///Applications/Microsoft%20PowerPoint.app/Contents/Resources/DFonts/YuGothR.ttc"); }
      @font-face { font-family: "Yu Gothic"; font-weight: 700; src: url("file:///Applications/Microsoft%20PowerPoint.app/Contents/Resources/DFonts/YuGothB.ttc"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background-color: #777777; }
      section[data-slide] { position: relative; width: 1920px; height: 1080px; overflow: hidden; background-color: #fbfaf7;
        color: #222222; font-family: "Yu Gothic", sans-serif; line-height: 1.5; }
      aside.notes { display: none; }
      em { font-style: normal; color: #d0306a; }
      .band { position: absolute; left: 120px; top: 0; width: 160px; height: 10px; background-color: #2f63b8; }
      .title { position: absolute; left: 120px; top: 380px; width: 1100px; font-size: 84px; font-weight: 700; line-height: 1.3; }
      .photo { position: absolute; left: 1300px; top: 300px; width: 480px; height: 480px; object-fit: cover; border-radius: 24px; }
      .head { position: absolute; left: 120px; top: 80px; font-size: 60px; font-weight: 700; }
      .cards { position: absolute; left: 120px; top: 300px; width: 1680px; display: flex; gap: 40px; }
      .card { flex: 1; height: 360px; padding: 40px; background-color: #ffffff; border: 3px solid #c9d4e6; border-radius: 18px;
        box-shadow: 0 6px 16px rgba(60, 70, 110, 0.12); }
      .card b { display: block; font-size: 44px; color: #2f63b8; }
      .card p { margin-top: 20px; font-size: 32px; line-height: 1.6; }
      .card p.phrase { word-break: auto-phrase; }
      .row { position: absolute; left: 120px; width: 1100px; height: 120px; display: flex; align-items: center; font-size: 40px;
        border-bottom: 2px solid #c9d4e6; }
      .mark { position: absolute; left: 1300px; top: 300px; width: 400px; height: 300px; }
    </style>
  </head>
  <body>
    <section data-slide id="cover">
      <div class="band" data-keep="band"></div>
      <h1 class="title">再配達が<em>1割</em>を超えている</h1>
      <img class="photo" src="photo.png" alt="宅配の箱が並んだ玄関" data-name="photo" />
      <aside class="notes">表紙です。</aside>
    </section>

    <section data-slide id="cards" data-transition="morph">
      <div class="band" data-keep="band"></div>
      <h2 class="head" data-step="0" data-fx="rise">原因は<em>2つ</em>ある</h2>
      <div class="cards">
        <div class="card" data-step="1" data-fx="pop" data-name="card-a">
          <b>不在</b>
          <p>受け取る人が家にいない時間に届く。共働きの家では、平日の昼はほとんど誰もいない。</p>
        </div>
        <div class="card" data-step="2" data-fx="fade" data-name="card-b">
          <b>時間指定のずれ</b>
          <p class="phrase">指定した時間に、配達が間に合わない。</p>
        </div>
        <div class="card" data-step="2" data-fx="wipe-right" data-delay="300" data-name="card-c">
          <b>置き場所</b>
          <p>置き配を選べない。</p>
        </div>
      </div>
      <aside class="notes">原因は2つです。<br />［クリック］1つめは不在。<br />［クリック］2つめは時間と置き場所。</aside>
    </section>

    <section data-slide id="rows" data-transition="fade" style="background: linear-gradient(160deg, #ebf1fa 0%, #dee9f7 100%)">
      <div class="band" data-keep="band"></div>
      <h2 class="head">比べると</h2>
      <div class="row" style="top: 260px">置き配</div>
      <div class="row" style="top: 380px" data-step="1" data-fx="wipe-right">宅配ボックス</div>
      <svg class="mark" viewBox="0 0 400 300" data-step="1" data-fx="wheel" data-delay="300">
        <ellipse cx="200" cy="150" rx="180" ry="120" fill="none" stroke="#e8457d" stroke-width="8" />
        <path d="M60 260 C 140 220, 260 220, 340 260" fill="none" stroke="#2f63b8" stroke-width="6" stroke-linecap="round" />
        <text x="200" y="160" font-size="40" text-anchor="middle" fill="#222222">ここ</text>
      </svg>
      <aside class="notes">［クリック］宅配ボックスが効く。</aside>
    </section>
  </body>
</html>
