# html-slide の設定の雛形。実体はデータの置き場（既定 ~/.quick-slide/）の engines/html-slide/config.yaml に置く（機体ごとに違う値）。
# 環境変数 HTML_SLIDE_CONFIG で別の場所を直に指せる
# 無ければ既定値で動く。

# 出力先（--out を省いたとき）。<out>/<台本の名前>/ に deck.pptx などが出る
out: ~/.quick-slide/engines/html-slide/output

# Chrome で文字を測るときの字体ファイル（ADR 0002・0020）。テーマの font の名前で引く。既定の字体は Noto Sans JP（DADS・SIL OFL 1.1）。
# Google Fonts の静的な Regular と Bold の TTF を置き、パスを書く（可変フォントの 1 ファイルではなく、太さごとのファイル）。
# Noto Sans JP の行が無い・ファイルが無いときは、游ゴシック（下。PowerPoint for Mac 同梱の Windows 版）で組む
fonts:
  "Noto Sans JP":
    regular: ~/.quick-slide/fonts/noto-sans-jp/NotoSansJP-Regular.ttf
    bold: ~/.quick-slide/fonts/noto-sans-jp/NotoSansJP-Bold.ttf
  "Yu Gothic":
    regular: /Applications/Microsoft PowerPoint.app/Contents/Resources/DFonts/YuGothR.ttc
    bold: /Applications/Microsoft PowerPoint.app/Contents/Resources/DFonts/YuGothB.ttc

# 描いた絵の置き場（キャッシュ・ADR 0014）。省けば ~/Library/Caches/quick-slide/html-slide/（環境変数 HTML_SLIDE_CACHE が優先）
# cache_dir: ~/Library/Caches/quick-slide/html-slide
# 合計の上限（MB）。超えたら古く使った区画から消す。0 は消さない。描いた絵は1枚約 2 MB
# cache_max_mb: 1024

# Node・puppeteer-core・Chrome（headless shell）の在りか（ADR 0016）。省けば Quick Slide の置き場
# （<データの置き場>/engines/html-slide/node/node_modules・…/chrome/）→ ~/.cache/html-video/node_modules・~/.cache/puppeteer の順に探す
# node_bin: /opt/homebrew/bin/node
# node_modules: ~/.quick-slide/engines/html-slide/node/node_modules
# chrome: ~/.quick-slide/engines/html-slide/chrome
