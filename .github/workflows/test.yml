# PR のときに、Windows でテストを回す（docs/adr/0023-ci-windows-first.md）。
#
# - main への push では回さない（PR で回したのと同じ中身。1 回 25 分あまりで、Windows は 2 倍で数える）
# - 試験が読まない文書（docs/・README.md・AGENTS.md・LICENSE）だけの変更では回さない。公開前の検査は文書だけの変更でも
#   要るので、別の workflow（public-check.yml）で必ず回す
# - リリースの PR（tools/release.py prepare が書く CHANGELOG.md と版の置き場 3 か所だけの変更）でも回さない。
#   この 4 つを読む試験は版の試験だけで、OS に依らない。形は public-check.yml の release.py check が見る。
#   ほかのファイルが 1 つでも混ざれば回る
# - 当面は Windows だけ。macOS は手元でいつも回していて、非公開のあいだは Actions の分数が 10 倍で減るため。
#   公開したら macOS も足す
# - 本物の Codex・Claude は呼ばない（テストが偽物を差す）。ログインは要らない
# - 試験の段は、前の段が落ちても続けて回す（どの組が落ちたかを 1 回で見る）。依存ソフトを入れられなければ回さない

name: test

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "AGENTS.md"
      - "LICENSE"
      - "CHANGELOG.md"
      - "src/quick_slide/__init__.py"
      - ".claude-plugin/plugin.json"
      - ".codex-plugin/plugin.json"
  # 手で起こすときは、回す 1 行を渡せる（Windows でだけ起きる失敗を、全部を回さずに確かめる。全部だと 20 分あまり）
  #   gh workflow run test.yml --ref <ブランチ> -f only='python3 skills/html-slide/tests/test_outputs.py deck_formats'
  workflow_dispatch:
    inputs:
      only:
        description: "この 1 行だけ回す（空なら全部）"
        required: false
        default: ""

permissions:
  contents: read

# 同じ PR に続けて push したら、前の回は止める（分数を減らさない）
concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      ONLY: ${{ inputs.only }}
      # 混みに弱い組: 本物の Chrome やサーバのプロセスを起こして時間を待つ試験。4 並列で全部を回すと、回ごとに
      # 違う試験が遅れて落ちた（単独なら通る）。この組だけ 2 並列で先に回す。落ちなくなれば 4 並列に上げる
      TIMING_GROUP: "live.* test_p4_restart.* test_p3_pitch_pages.* test_fast_page_ops.*"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # 試験とエンジンは `python3` の名で呼ぶ。Windows の Python には python.exe しか無いので、同じフォルダに写しを置く
      - name: python3 の名前でも呼べるようにする
        run: |
          dir="$(dirname "$(command -v python)")"
          [ -e "$dir/python3.exe" ] || cp "$dir/python.exe" "$dir/python3.exe"
          python3 -c 'import sys; print(sys.version, sys.executable)'

      # 入れるものは quick_slide_setup.py --setup と同じ（Python のパッケージ・puppeteer-core・Chrome の headless shell・
      # モーション用の Playwright の Chromium）。置き場は使い捨てで、エンジンには環境変数で教える
      - name: 依存ソフトを入れる
        id: deps
        run: |
          python -m pip install --disable-pip-version-check python-pptx lxml Pillow PyYAML playwright
          python -m playwright install chromium
          engine="$RUNNER_TEMP/html-slide"
          npm install --prefix "$engine/node" --no-audit --no-fund puppeteer-core
          "$engine/node/node_modules/.bin/browsers" install chrome-headless-shell@stable --path "$engine/chrome"
          # HTML_SLIDE_CHROME は実行ファイルを指す（フォルダは受けない）
          chrome="$(find "$engine/chrome" -name chrome-headless-shell.exe | head -1)"
          [ -n "$chrome" ] || { echo "chrome-headless-shell.exe が見つからない"; exit 1; }
          echo "HTML_SLIDE_NODE_MODULES=$engine/node/node_modules" >> "$GITHUB_ENV"
          echo "HTML_SLIDE_CHROME=$chrome" >> "$GITHUB_ENV"

      - name: サーバと画面（混みに弱い組・2 並列）
        id: timing
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !env.ONLY }}
        run: |
          set -f   # * をファイル名に展開しない
          args=(); for k in $TIMING_GROUP; do args+=(-k "$k"); done
          bash tests/run.sh -j 2 "${args[@]}" 2>&1 | tee "$RUNNER_TEMP/timing-tests.log"

      # ジョブ全体が終わる前にも、失敗した段のログを取得できるようにする。
      - name: 混みに弱い組の失敗ログを残す
        if: ${{ !cancelled() && steps.timing.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: timing-tests-log
          path: ${{ runner.temp }}/timing-tests.log
          retention-days: 7

      - name: サーバと画面（ほか・4 並列）
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !env.ONLY }}
        run: |
          set -f
          args=(); for k in $TIMING_GROUP; do args+=(-x "$k"); done
          bash tests/run.sh -j 4 "${args[@]}"

      - name: image-slide
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !env.ONLY }}
        run: bash skills/image-slide/tests/run.sh

      - name: html-slide
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !env.ONLY }}
        run: bash skills/html-slide/tests/run.sh

      - name: illust
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !env.ONLY }}
        run: bash skills/illust/tests/run.sh

      - name: motion-slide
        if: ${{ !cancelled() && steps.deps.outcome == 'success' && !env.ONLY }}
        run: bash skills/motion-slide/tests/run.sh

      - name: 指定した 1 行だけ
        if: ${{ steps.deps.outcome == 'success' && env.ONLY }}
        run: eval "$ONLY"
